name: Alicia Mac V0.4 — IA et identité visuelle

on:
  push:
    branches:
      - alicia-mac-v04
    paths:
      - "native/alicia_mac_v04/**"
      - "assistant-ia/**"
      - ".github/workflows/alicia-mac-v04.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler Alicia Mac V0.4 pour Big Sur Intel
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assembler la version Mac native et ses modules d'Alicia Safari
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Alicia V0.4.app"
          WEB="$APP/Contents/Resources/Web"
          mkdir -p "$APP/Contents/MacOS" "$WEB"
          # Copie des outils HTML/CSS/JS/JSON, en lecture seule, sans secrets ni scripts système.
          find assistant-ia -maxdepth 1 -type f -print0 |
          while IFS= read -r -d '' file; do
            case "$file" in
              *.html|*.js|*.mjs|*.css|*.json|*.svg|*.webmanifest|*.ico)
                cp "$file" "$WEB/$(basename "$file")";;
            esac
          done
          cp native/alicia_mac_v03/mac-large-composer.css "$WEB/alicia-mac.css"
          cat native/alicia_mac_v032/avatar-fallback.css >> "$WEB/alicia-mac.css"
          cat native/alicia_mac_v033/avatar-preview.css >> "$WEB/alicia-mac.css"
          cat native/alicia_mac_v04/mac-v04.css >> "$WEB/alicia-mac.css"
          cp native/alicia_mac_v033/avatar-autonomous.js "$WEB/avatar.js"
          cp native/alicia_mac_v032/avatar-motion-autonomous.mjs "$WEB/avatar-motion-autonomous.mjs"
          cp native/alicia_mac_v033/avatar-fallback.js "$WEB/avatar-fallback.js"
          cp native/alicia_mac_v04/mac-ai.js "$WEB/mac-ai.js"
          cp native/alicia_mac_v04/avatar-photo.js "$WEB/avatar-photo.js"
          # Portrait déjà présent dans le dépôt Alicia, sans image externe.
          base64 -D -i native/alicia_mac_v02/AliciaPortrait.jpg.b64 -o "$WEB/AliciaPortrait.jpg"
          sips -g pixelWidth -g pixelHeight "$WEB/AliciaPortrait.jpg"
          # Version figée du SDK depuis Puter officiel : meilleure compatibilité
          # avec WebKit ancien. Le proxy Swift reste une solution de repli.
          if curl --fail --location --silent --show-error --connect-timeout 8 --max-time 24               https://js.puter.com/v2/ --output "$WEB/puter-sdk.bundle.js" &&              test "$(stat -f%z "$WEB/puter-sdk.bundle.js")" -gt 1000; then
             echo "Puter JS inclus (SHA256):"
             shasum -a 256 "$WEB/puter-sdk.bundle.js"
          else
             echo 'console.warn("Puter non intégré à la compilation ; tentative via le Mac.");const s=document.createElement("script");s.src="./puter-sdk.js";s.async=true;document.head.append(s);' > "$WEB/puter-sdk.bundle.js"
          fi
          python3 - <<'PY'
          from pathlib import Path
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'Alicia V0.4.app'/'Contents'/'Resources'/'Web'
          index=root/'index.html'
          s=index.read_text(encoding='utf-8')
          assert '</head>' in s and 'id="question" rows="2"' in s
          s=s.replace('</head>', '<script>window.AliciaNativeMac=true;</script><script src="./puter-sdk.bundle.js" defer></script><script src="./avatar-fallback.js" defer></script><script src="./mac-ai.js" defer></script><script src="./avatar-photo.js" defer></script><link rel="stylesheet" href="./alicia-mac.css"></head>',1)
          preview=Path('native/alicia_mac_v033/avatar-preview.html').read_text(encoding='utf-8')
          assert '<div class="avatar-stage"><canvas' in s
          s=s.replace('<div class="avatar-stage"><canvas', '<div class="avatar-stage">'+preview+'<canvas',1)
          assert 'id="puter-connect"' in s and 'id="puter-state"' in s
          s=s.replace('<button id="puter-connect"', '<button id="puter-connect"',1)
          s=s.replace('<p id="puter-state"', '<button type="button" id="puter-retry" class="secondary">↻ Réessayer le chargement de Puter</button><p id="puter-state"',1)
          s=s.replace('Sur iPhone, un compte Puter permet', 'Sur Mac, un compte Puter permet',1)
          s=s.replace('iPhone — IA en ligne (compte Puter, quota gratuit)', 'Mac — IA en ligne (compte Puter, quota limité)', 1)
          s=s.replace('glissez pour tourner sa tête', 'Alicia tourne automatiquement sur elle-même', 1)
          s=s.replace("Les yeux suivent ton doigt sur l'écran.", "Ses yeux bougent automatiquement.", 1)
          s=s.replace('Tester les yeux et la voix', 'Tester l’avatar autonome et la voix', 1)
          s=s.replace('id="question" rows="2"', 'id="question" rows="5"',1)
          s=s.replace('<title>Alicia — Assistant personnel</title>', '<title>Alicia Mac V0.4 — Assistant personnel</title>',1)
          index.write_text(s,encoding='utf-8')
          app=root/'app.js'
          js=app.read_text(encoding='utf-8')
          original=':(isApplePhone?"puter":"local");'
          assert original in js, 'Le choix du moteur a changé: vérifier avant de mettre à jour'
          js=js.replace(original,':((isApplePhone||window.AliciaNativeMac)?"puter":"local");',1)
          # Accueil local: une salutation peut recevoir une vraie réponse simple,
          # sans faire croire que le grand modèle IA est connecté.
          anchor='if(choice==="puter"){'
          assert anchor in js
          js=js.replace(anchor, '''if(choice==="puter"){
            if(window.AliciaNativeMac && !review && !window.AliciaPuter?.ready()){
              const greeting=window.AliciaMacAI?.offlineGreeting(messages.slice(-1)[0]?.content);
              if(greeting)return greeting;
            }''',1)
          # Vérification Wi-Fi mobile sans demander un consentement réseau fictif sur Mac.
          js=js.replace('window.AliciaWiFi?.requireConfirmed();',
                         'if(!window.AliciaNativeMac)window.AliciaWiFi?.requireConfirmed();',1)
          js=js.replace('"Sur iPhone : connecte ton compte Puter', '"Sur Mac : connecte ton compte Puter',1)
          js=js.replace('"Module IA iPhone indisponible. Actualise Alicia dans Safari."',
                         '"Module IA Puter indisponible sur ce Mac. Teste la connexion dans le panneau Puter."',1)
          js=js.replace('"Pour analyser cette image, sélectionne le mode iPhone', '"Pour analyser cette image, sélectionne le mode Puter',1)

          js=js.replace('if("serviceWorker" in navigator)window.addEventListener(', 'if(false&&"serviceWorker" in navigator)window.addEventListener(')
          app.write_text(js,encoding='utf-8')
          assert (root/'composer-tools.js').is_file()
          assert (root/'puter-engine.js').is_file()
          assert (root/'avatar.js').is_file()
          assert (root/'design-studio.js').is_file()
          assert (root/'data-lab.js').is_file()
          assert (root/'wifi-policy.js').is_file()
          print('Modules integrés :',len(list(root.iterdir())))
          PY
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleExecutable</key><string>AliciaV03</string>
            <key>CFBundleIdentifier</key><string>fr.alicia.assistant.mac.v04</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Alicia V0.4</string>
            <key>CFBundleDisplayName</key><string>Alicia V0.4</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.4.0</string>
            <key>CFBundleVersion</key><string>7</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAppTransportSecurity</key><dict>
              <key>NSAllowsLocalNetworking</key><true/>
            </dict>
            <key>NSMicrophoneUsageDescription</key><string>Alicia utilise le microphone seulement sur demande de l'utilisateur.</string>
            <key>NSCameraUsageDescription</key><string>Alicia utilise la caméra seulement sur demande de l'utilisateur.</string>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"

      - name: Vérifier le code web existant et les tests sans frais API
        shell: bash
        run: |
          set -euo pipefail
          cd assistant-ia
          node --test tests/*.test.mjs
          cd ..
          node --test native/alicia_mac_v032/avatar-autonomy.test.mjs
          node --test native/alicia_mac_v033/repair-smoke.test.mjs
          node --test native/alicia_mac_v04/v04.test.mjs
          node --input-type=module --check < native/alicia_mac_v033/avatar-autonomous.js
          node --check native/alicia_mac_v033/avatar-fallback.js
          node --input-type=module --check < native/alicia_mac_v032/avatar-motion-autonomous.mjs


      - name: Compiler Alicia native en x86_64 macOS 11.0
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Alicia V0.4.app"
          xcrun --sdk macosx swiftc -parse-as-library \
            -target x86_64-apple-macos11.0 \
            -framework AppKit -framework SwiftUI -framework WebKit \
            -framework Network -framework Combine \
            native/alicia_mac_v04/AliciaV04.swift \
            -o "$APP/Contents/MacOS/AliciaV03"
          chmod 755 "$APP/Contents/MacOS/AliciaV03"
          /usr/bin/file "$APP/Contents/MacOS/AliciaV03"

      - name: Archiver Alicia V0.4 sans remplacer V0.1 ou V0.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Alicia V0.4.app" dist/Alicia-Mac-V0.4.zip
          test -s dist/Alicia-Mac-V0.4.zip

      - name: Publier le téléchargement personnel
        uses: actions/upload-artifact@v4
        with:
          name: Alicia-Mac-V0.4
          path: dist/Alicia-Mac-V0.4.zip
          if-no-files-found: error
          retention-days: 14
