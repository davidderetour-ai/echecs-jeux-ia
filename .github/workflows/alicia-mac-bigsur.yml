name: Alicia Mac Big Sur — application native gratuite

on:
  push:
    branches:
      - alicia-flutter-native-v1
    paths:
      - "native/alicia_mac_app/**"
      - ".github/workflows/alicia-mac-bigsur.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler Alicia pour Mac Intel (Big Sur)
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Créer Alicia.app pour macOS Big Sur 11+
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Alicia.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleExecutable</key><string>Alicia</string>
            <key>CFBundleIdentifier</key><string>fr.alicia.assistant.mac</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Alicia</string>
            <key>CFBundleDisplayName</key><string>Alicia</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          base64 -D -i native/alicia_flutter/assets/alicia_portrait.b64 -o "$RUNNER_TEMP/portrait.jpg"
          sips -s format png "$RUNNER_TEMP/portrait.jpg" --out "$APP/Contents/Resources/AliciaPortrait.png" >/dev/null
          xcrun --sdk macosx swiftc -parse-as-library \
            -target x86_64-apple-macos11.0 \
            -framework AppKit -framework SwiftUI -framework Combine \
            -framework AVFoundation -framework Network \
            native/alicia_mac_app/AliciaMac.swift \
            -o "$APP/Contents/MacOS/Alicia"
          chmod 755 "$APP/Contents/MacOS/Alicia"
          plutil -lint "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/Alicia"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Alicia-Mac-BigSur.zip
          test -s dist/Alicia-Mac-BigSur.zip

      - name: Publier le fichier à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: Alicia-Mac-BigSur
          path: dist/Alicia-Mac-BigSur.zip
          if-no-files-found: error
          retention-days: 14
