name: Tests Atelier IA
on:
  push:
    paths:
      - "assistant-ia/**"
      - ".github/workflows/atelier-ia-tests.yml"
  pull_request:
    paths:
      - "assistant-ia/**"
      - ".github/workflows/atelier-ia-tests.yml"
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la syntaxe
        working-directory: assistant-ia
        run: |
          node --check app.js
          node --check netlify/functions/chat.mjs
          node --check avatar.js
          node --check expression-core.mjs
          node --check data-core.mjs
          node --check data-lab.js
          node --check mac-core.mjs
          node --check mac-lab.js
          node --check local-server.mjs
          node --check github-health.js
          node --check github-proposal-core.mjs
          node --check github-maintainer.mjs
          node --check github-draft.mjs
          node --check puter-engine.js
          node --check composer-core.mjs
          node --check composer-tools.js
          node --check wifi-policy.js
          node --check avatar-motion.mjs
          node --check copy-learning.js
          node --check copy-learning-core.mjs
          node --check github-portfolio.mjs
          bash -n INSTALLER_MAC_BIG_SUR.command
          bash -n 'Ouvrir Alicia.command'
          bash -n 'Lancer liaison iPhone.command'
          bash -n 'Voir mes projets GitHub.command'
          bash -n 'Activer Alicia Original.command'
          bash -n 'Désinstaller cette copie.command'
          ruby -c original-activate.rb
          ruby -c github-mac.rb
          ruby -c mac-iphone-bridge.rb
          node --check permission-policy.mjs
          node --check success-metrics.mjs
          bash -n mac-audit.sh
          bash -n mac-improve.sh
          bash mac-improve.sh --help
      - name: Tests unitaires
        working-directory: assistant-ia
        run: npm test
