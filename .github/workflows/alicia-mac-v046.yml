name: Alicia Mac Fusion-v0.9.3 — Web, recherches, comparaison IA et cours hors ligne

on:
  push:
    branches:
      - alicia-mac-web-v046
    paths:
      - "native/alicia_mac_v046/**"
      - "native/alicia_mac_v045/**"
      - "native/alicia_mac_v042/**"
      - "native/alicia_mac_v041/**"
      - "native/alicia_mac_v04/**"
      - "assistant-ia/**"
      - ".github/workflows/alicia-mac-v046.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler Alicia Mac Fusion-v0.9.3 pour Big Sur Intel
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Assembler la version Mac native et ses modules d'Alicia Safari
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Alicia Fusion-v0.9.3.app"
          WEB="$APP/Contents/Resources/Web"
          mkdir -p "$APP/Contents/MacOS" "$WEB"
          # Copie des outils HTML/CSS/JS/JSON, en lecture seule, sans secrets ni scripts système.
          find assistant-ia -maxdepth 1 -type f -print0 |
          while IFS= read -r -d '' file; do
            case "$file" in
              *.html|*.js|*.mjs|*.css|*.json|*.svg|*.webmanifest|*.ico)
                cp "$file" "$WEB/$(basename "$file")";;
            esac
          done
          cp -R assistant-ia/vendor "$WEB/vendor"
          cp -R assistant-ia/models "$WEB/models"
          cp native/alicia_mac_v03/mac-large-composer.css "$WEB/alicia-mac.css"
          cat native/alicia_mac_v032/avatar-fallback.css >> "$WEB/alicia-mac.css"
          cat native/alicia_mac_v033/avatar-preview.css >> "$WEB/alicia-mac.css"
          cat native/alicia_mac_v04/mac-v04.css >> "$WEB/alicia-mac.css"
          cat native/alicia_mac_v041/native.css >> "$WEB/alicia-mac.css"
          cat assistant-ia/fusion-ui.css >> "$WEB/alicia-mac.css"
          cp native/alicia_mac_v032/avatar-motion-autonomous.mjs "$WEB/avatar-motion-autonomous.mjs"
          cp native/alicia_mac_v033/avatar-fallback.js "$WEB/avatar-fallback.js"
          cp native/alicia_mac_v04/mac-ai.js "$WEB/mac-ai.js"
          cp native/alicia_mac_v04/ia-bridge.js "$WEB/ia-bridge.js"
          cp native/alicia_mac_v04/avatar-photo.js "$WEB/avatar-photo.js"
          # Portrait déjà présent dans le dépôt Alicia, sans image externe.
          base64 -D -i native/alicia_mac_v02/AliciaPortrait.jpg.b64 -o "$WEB/AliciaPortrait.jpg"
          sips -g pixelWidth -g pixelHeight "$WEB/AliciaPortrait.jpg"
          # Les deux vraies vues photographiques proviennent de l'image de référence.
          python3 - <<'PHOTO'
          from pathlib import Path
          import base64
          web=Path(__import__('os').environ['RUNNER_TEMP'])/'Alicia Fusion-v0.9.3.app'/'Contents'/'Resources'/'Web'
          for part in ('front','back'):
              source=Path('native/alicia_mac_v04')/('portrait-'+part+'.webp.b64')
              data=base64.b64decode(source.read_text().strip(),validate=True)
              assert len(data)>1500 and data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              assert int.from_bytes(data[4:8],'little')+8==len(data), 'Image incomplete'
              (web/('portrait-'+part+'.webp')).write_bytes(data)
          print('Portraits Alicia face/dos vérifiés dans le paquet Mac')
          PHOTO
          cp native/alicia_mac_v045/native-memory-bridge.js "$WEB/native-memory-bridge.js"
          # App Mac totalement gratuite : aucune API et aucun SDK cloud.
          rm -f "$WEB/puter-engine.js" "$WEB/puter-sdk.bundle.js" "$WEB/native-puter-bridge.js" "$WEB/mac-ai.js" "$WEB/ia-bridge.js"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'Alicia Fusion-v0.9.3.app'/'Contents'/'Resources'/'Web'
          html=root/'index.html'
          s=html.read_text(encoding='utf-8')
          assert 'src="./original-engine.js"' in s
          assert '<div class="avatar-stage"><canvas' in s
          s=s.replace('</head>','<script>window.AliciaNativeMac=true;</script><link rel="stylesheet" href="./alicia-mac.css"></head>',1)
          original='<script src="./original-engine.js" defer></script><script src="./app.js" defer></script>'
          assert original in s, 'Scripts Alicia Original absents'
          s=s.replace(original,'<script src="./original-engine.js" defer></script><script src="./native-memory-bridge.js" defer></script><script src="./app.js" defer></script>',1)
          s=s.replace('id="question" rows="2"', 'id="question" rows="5"',1)
          s=s.replace('<title>Alicia — Assistant personnel</title>', '<title>Alicia Mac Fusion-v0.9.3 — Moteur original gratuit</title>',1)
          assert 'src="./puter-engine.js"' not in s
          assert 'src="./original-controls.js"' in s
          assert 'src="./fusion-ui.js"' in s and 'href="./fusion-ui.css"' in s
          html.write_text(s,encoding='utf-8')
          app=root/'app.js'
          js=app.read_text(encoding='utf-8')
          assert 'connection.value="original"' in js
          js=js.replace('if("serviceWorker" in navigator)window.addEventListener(', 'if(false&&"serviceWorker" in navigator)window.addEventListener(',1)
          app.write_text(js,encoding='utf-8')
          for required in ('original-engine.js','original-controls.js','original-controls.css','native-memory-bridge.js','cortect-ui.js','alicia-academy.mjs','alicia-professeur-ui.js','alicia-professeur.css','web-learning-core.mjs','web-learning-ui.js','web-learning.css','image3d-ui.js','three-studio.js','three-studio.css','alicia-avatar3d.js','alicia-model-gallery.js','course-learning.mjs','understand-requests.mjs','fusion-ui.css','alicia-reference-theme.css','alicia-reference-ui.js','vendor/three.r147.min.js','vendor/OrbitControls.r147.js','vendor/GLTFLoader.r147.js','models/alicia_realiste_rocketbox.glb','models/alicia_realiste_manifest.json','models/ROCKETBOX-MIT-LICENSE.md','vendor/THREE-LICENSE.txt','python-vscode-ui.js','cortect-rag-core.mjs','cortect-agent-core.mjs','portrait-front.webp','portrait-back.webp'):
              assert (root/required).is_file(),required
          print('Alicia Mac Original 0.9.3 : moteur inclus, aucune requête IA externe ni service payant.')
          PY
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleExecutable</key><string>AliciaV03</string>
            <key>CFBundleIdentifier</key><string>fr.alicia.assistant.mac.v045</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Alicia Fusion-v0.9.3</string>
            <key>CFBundleDisplayName</key><string>Alicia Fusion-v0.9.3</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.9.3</string>
            <key>CFBundleVersion</key><string>13</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSAppTransportSecurity</key><dict>
              <key>NSAllowsLocalNetworking</key><true/>
            </dict>
            <key>NSMicrophoneUsageDescription</key><string>Alicia utilise le microphone seulement sur demande de l'utilisateur.</string>
            <key>NSCameraUsageDescription</key><string>Alicia utilise la caméra seulement sur demande de l'utilisateur.</string>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"

      - name: Vérifier le code web existant et les tests sans frais API
        shell: bash
        run: |
          set -euo pipefail
          cd assistant-ia
          node --test tests/*.test.mjs
          cd ..
          node --test native/alicia_mac_v032/avatar-autonomy.test.mjs
          node --test native/alicia_mac_v033/repair-smoke.test.mjs
          node --test native/alicia_mac_v04/v04.test.mjs
          node --test native/alicia_mac_v041/v041.test.mjs
          node --input-type=module --check < assistant-ia/web-learning-ui.js
          node --input-type=module --check < assistant-ia/web-learning-core.mjs
          node --check assistant-ia/three-studio.js
          node --check assistant-ia/alicia-avatar3d.js
          node --check assistant-ia/alicia-model-gallery.js
          node --check assistant-ia/course-learning.mjs
          node --check assistant-ia/understand-requests.mjs
          node --check assistant-ia/vendor/GLTFLoader.r147.js
          node --check assistant-ia/alicia-reference-ui.js
          node --check assistant-ia/original-engine.js
          node --check assistant-ia/original-controls.js
          node --input-type=module --check < assistant-ia/cortect-ui.js
          node --input-type=module --check < assistant-ia/cortect-chat.js
          node --input-type=module --check < assistant-ia/image3d-ui.js
          node --input-type=module --check < assistant-ia/python-vscode-ui.js
          node --check native/alicia_mac_v045/native-memory-bridge.js
          node --check native/alicia_mac_v04/photo-avatar.js
          node --check native/alicia_mac_v04/ia-bridge.js
          node --check native/alicia_mac_v041/native-puter-bridge.js
          node --input-type=module --check < native/alicia_mac_v033/avatar-autonomous.js
          node --check native/alicia_mac_v033/avatar-fallback.js
          node --input-type=module --check < native/alicia_mac_v032/avatar-motion-autonomous.mjs


      - name: Compiler Alicia native en x86_64 macOS 11.0
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Alicia Fusion-v0.9.3.app"
          # Compiler l’application Mac Intel avec moteur Alicia Original intégré dans la vue Web.
          xcrun --sdk macosx swiftc -parse-as-library \
            -target x86_64-apple-macos11.0 \
            -framework AppKit -framework SwiftUI -framework WebKit \
            -framework Network -framework Combine -framework Security \
            native/alicia_mac_v046/AliciaV046.swift \
            native/alicia_mac_v045/AliciaDiskMemory.swift \
            -o "$APP/Contents/MacOS/AliciaV03"
          chmod 755 "$APP/Contents/MacOS/AliciaV03"
          /usr/bin/file "$APP/Contents/MacOS/AliciaV03"

      - name: Vérifier une sauvegarde Mac après relancement dans un nouveau processus
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx swiftc -parse-as-library -target x86_64-apple-macos11.0 \
            native/alicia_mac_v045/AliciaDiskMemory.swift \
            native/alicia_mac_v045/memory-smoke.swift \
            -o "$RUNNER_TEMP/alicia-memory-smoke"
          "$RUNNER_TEMP/alicia-memory-smoke" write
          "$RUNNER_TEMP/alicia-memory-smoke" read

      - name: Archiver Alicia Fusion-v0.9.3 sans remplacer V0.1 ou V0.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Alicia Fusion-v0.9.3.app" dist/Alicia-Mac-Fusion-v0.9.3.zip
          test -s dist/Alicia-Mac-Fusion-v0.9.3.zip

      - name: Publier le téléchargement personnel
        uses: actions/upload-artifact@v4
        with:
          name: Alicia-Mac-Fusion-v0.9.3
          path: dist/Alicia-Mac-Fusion-v0.9.3.zip
          if-no-files-found: error
          retention-days: 14
