name: Alicia Mac V0.2 — nouvelle interface

on:
  push:
    branches:
      - alicia-flutter-native-v1
    paths:
      - "native/alicia_mac_v02/**"
      - ".github/workflows/alicia-mac-v02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v02:
    name: Compiler Alicia V0.2 pour Mac Intel Big Sur
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Préparer l’application et le portrait
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Alicia V0.2.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>fr</string>
            <key>CFBundleExecutable</key><string>AliciaV02</string>
            <key>CFBundleIdentifier</key><string>fr.alicia.assistant.mac.v02</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Alicia V0.2</string>
            <key>CFBundleDisplayName</key><string>Alicia V0.2</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.2.0</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          base64 -D -i native/alicia_mac_v02/AliciaPortrait.jpg.b64 \
            -o "$APP/Contents/Resources/AliciaPortrait.jpg"
          sips -g pixelWidth -g pixelHeight "$APP/Contents/Resources/AliciaPortrait.jpg"
          /usr/bin/file "$APP/Contents/Resources/AliciaPortrait.jpg"
          plutil -lint "$APP/Contents/Info.plist"

      - name: Compiler l’interface SwiftUI Intel pour macOS 11
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Alicia V0.2.app"
          xcrun --sdk macosx swiftc -parse-as-library \
            -target x86_64-apple-macos11.0 \
            -framework AppKit -framework SwiftUI -framework Combine \
            -framework AVFoundation -framework Network \
            native/alicia_mac_v02/AliciaV02.swift \
            -o "$APP/Contents/MacOS/AliciaV02"
          chmod +x "$APP/Contents/MacOS/AliciaV02"
          /usr/bin/file "$APP/Contents/MacOS/AliciaV02"

      - name: Fabriquer l’archive pour le Mac personnel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Alicia V0.2.app" dist/Alicia-Mac-V0.2.zip
          test -s dist/Alicia-Mac-V0.2.zip

      - name: Mettre l’application à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Alicia-Mac-V0.2
          path: dist/Alicia-Mac-V0.2.zip
          if-no-files-found: error
          retention-days: 14
