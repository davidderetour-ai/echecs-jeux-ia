name: Alicia iPhone — fabriquer IPA gratuit

on:
  push:
    branches:
      - alicia-flutter-native-v1
    paths:
      - "native/alicia_flutter/**"
      - ".github/workflows/alicia-iphone-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Compiler Alicia pour iPhone
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Récupérer le projet Alicia
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Intégrer tous les anciens modèles dans l'IPA iPhone
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/alicia-modeles" native/alicia_flutter/assets/alicia_web
          git archive FETCH_HEAD assistant-ia | tar -xf - -C "$RUNNER_TEMP/alicia-modeles"
          cp -R "$RUNNER_TEMP/alicia-modeles/assistant-ia/." native/alicia_flutter/assets/alicia_web/
          test -s native/alicia_flutter/assets/alicia_web/models/alicia_realiste_rocketbox.glb
          test -s native/alicia_flutter/assets/alicia_web/alicia-model-gallery.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("native/alicia_flutter/assets/alicia_web")
          release=json.loads((root/"fusion-release.json").read_text())
          assert release["version"]=="0.9.2", release["version"]
          assert all((root/p).exists() for p in ("index.html","alicia-avatar3d.js","alicia-model-gallery.js","models/alicia_realiste_rocketbox.glb","vendor/three.r147.min.js"))
          print("Alicia Fusion 0.9.2 : personnages réaliste/stylisé, entier/portrait et anciens portraits embarqués")
          PY

      - name: Générer uniquement les fichiers iOS manquants
        working-directory: native/alicia_flutter
        run: |
          flutter create --platforms=ios --org fr.alicia --project-name alicia_native .
          flutter pub get
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Alicia" ios/Runner/Info.plist

      - name: Compiler sans certificat payant
        working-directory: native/alicia_flutter
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --verbose > /tmp/alicia-ios-build.log 2>&1 || {
            grep -nE 'error:|Error|failed|Provisioning|Signing' /tmp/alicia-ios-build.log | tail -50 || true
            tail -80 /tmp/alicia-ios-build.log
            exit 1
          }
          tail -25 /tmp/alicia-ios-build.log

      - name: Préparer le fichier IPA pour AltStore Classic
        working-directory: native/alicia_flutter
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (
            cd dist
            zip -qry Alicia-native-unsigned.ipa Payload
          )
          rm -rf dist/Payload
          test -s dist/Alicia-native-unsigned.ipa

      - name: Publier le fichier IPA dans les artefacts du workflow
        uses: actions/upload-artifact@v4
        with:
          name: Alicia-iPhone-IPA-Fusion-0.9.2
          path: native/alicia_flutter/dist/Alicia-native-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
