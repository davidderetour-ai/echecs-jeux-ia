name: Échecs & Jeux IA — Compiler IPA iPhone native gratuite
on:
  push:
    branches:
      - main
      - echecs-jeux-ios-natif-iphone-20261017
      - fix-ios-white-screen-20261017
      - ios-native-visible-menu-diagnostic-20261017
      - fix-ios-go-false-diagnostic-20261017
      - ui-iphone-simple-jeux-20261017
      - ui-iphone-compact-safety-v391-20261017
      - interface-choisie-claire-392-20261017
      - prep-partie-plein-ecran-tous-jeux-20261017
    paths:
      - "native/echecs_ios/**"
      - "app.js"
      - "game-clocks.js"
      - "game-setup.mjs"
      - "game-bots.mjs"
      - "go-persistence.mjs"
      - "extras.js"
      - "dames-francaises.js"
      - "shogi-app.js"
      - "tests/game-bots-setup.test.mjs"
      - "game-setup-ui.mjs"
      - "standalone-play.mjs"
      - "game-setup.css"
      - "go.html"
      - "go.js"
      - "dames-francaises.html"
      - "peace.html"
      - "index.html"
      - "styles.css"
      - "alicia-games.mjs"
      - "tests/mobile-ui.test.mjs"
      - ".github/workflows/echecs-ios-ipa.yml"
  pull_request:
    paths:
      - "native/echecs_ios/**"
      - "app.js"
      - "game-clocks.js"
      - "game-setup.mjs"
      - "game-bots.mjs"
      - "go-persistence.mjs"
      - "extras.js"
      - "dames-francaises.js"
      - "shogi-app.js"
      - "tests/game-bots-setup.test.mjs"
      - "game-setup-ui.mjs"
      - "standalone-play.mjs"
      - "game-setup.css"
      - "go.html"
      - "go.js"
      - "dames-francaises.html"
      - "peace.html"
      - "index.html"
      - "styles.css"
      - "alicia-games.mjs"
      - "tests/mobile-ui.test.mjs"
      - ".github/workflows/echecs-ios-ipa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Compiler Échecs & Jeux IA pour iPhone (arm64)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Récupérer les jeux et moteurs locaux
        uses: actions/checkout@v4
      - name: Vérifier les moteurs existants sans modifier les versions
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node --check app.js
          node --check go.js
          node --check dames-francaises.js
          node --check shogi-app.js
      - name: Compiler l'IPA iOS native avec moteur hors ligne
        run: bash native/echecs_ios/build_ipa.sh
      - name: Tester en HTTP local les pages et moteurs embarqués
        run: bash native/echecs_ios/host_server_smoke.sh
      - name: Publier le fichier pour AltStore Classic
        uses: actions/upload-artifact@v4
        with:
          name: Echecs-Jeux-IA-iPhone-IPA-v3.9.3
          path: dist/Echecs-Jeux-IA-iPhone/Echecs-Jeux-IA-v3.9.3.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publier le téléchargement direct de l'application iPhone
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer l'IPA compilé et testé
        uses: actions/download-artifact@v4
        with:
          name: Echecs-Jeux-IA-iPhone-IPA-v3.9.3
          path: release-ipa
      - name: Publier le fichier .ipa sur GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ipa="release-ipa/Echecs-Jeux-IA-v3.9.3.ipa"
          test -s "$ipa"
          if gh release view "v3.9.3" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v3.9.3" "$ipa" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v3.9.3" "$ipa" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --latest \
              --title "Échecs & Jeux IA iPhone v3.9.3" \
              --notes "Application iPhone native gratuite pour AltStore. Télécharge le fichier IPA directement sans chercher dans Actions ni Artifacts. Mise à jour de la version existante, sans désinstaller les jeux ni les sauvegardes. L'IPA est non signé : AltStore et AltServer sont nécessaires pour l'installation."
          fi
          gh release view "v3.9.3" --repo "$GITHUB_REPOSITORY" --json url,assets
