name: alicia_native
description: Alicia — interface native iOS Android macOS Windows, maquette fonctionnelle.
publish_to: none
version: 0.9.4+13

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 6.1.0
  flutter_tts: ^4.2.5
  webview_flutter: ^4.10.0
  shared_preferences: ^2.5.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/alicia_portrait.b64
    - assets/alicia_web/
    - assets/alicia_web/vendor/
    - assets/alicia_web/models/
