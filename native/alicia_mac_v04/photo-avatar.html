<div class="alicia-photo-stage" id="alicia-photo-stage">
  <div class="alicia-photo-scene" role="img" aria-label="Alicia au style de la photographie de référence, montrée de face et de dos pendant sa rotation autonome">
    <div class="alicia-photo-rotator" id="alicia-photo-rotator">
      <div class="alicia-photo-side alicia-photo-front">
        <img src="./portrait-front.webp" alt="" decoding="async" draggable="false">
        <div class="alicia-photo-face-motion" aria-hidden="true"></div>
      </div>
      <div class="alicia-photo-side alicia-photo-back">
        <img src="./portrait-back.webp" alt="" decoding="async" draggable="false">
      </div>
    </div>
  </div>
  <div class="alicia-photo-caption" id="alicia-photo-caption">Alicia se retourne toute seule · vue de face et de dos · animation visuelle 2,5D</div>
  <button type="button" id="alicia-photo-pause" class="secondary alicia-photo-pause">⏸ Pause</button>
</div>
